        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        fill: #94A3B8;
      }

      .small {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                     Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #94A3B8;
      }

      .title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                     Consolas, "Liberation Mono", monospace;
        font-size: 42px;
        font-weight: 800;
        fill: #F8FAFC;
      }

      .role {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                     Consolas, "Liberation Mono", monospace;
        font-size: 25px;
        font-weight: 700;
        fill: #22D3EE;
      }

      .tech {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                     Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #E2E8F0;
      }

      .command {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                     Consolas, "Liberation Mono", monospace;
        font-size: 15px;
        font-weight: 600;
        fill: #22D3EE;
      }

    </style>

