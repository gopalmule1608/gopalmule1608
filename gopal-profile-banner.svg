     aria-label="Gopal Mule — Fullstack Developer GitHub profile banner">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="55%" stop-color="#061326"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="photoGlow">
      <stop offset="0%" stop-color="#008cff" stop-opacity=".55"/>
      <stop offset="65%" stop-color="#0066ff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28"
            fill="none"
            stroke="#22D3EE"
            stroke-opacity=".045"/>
    </pattern>

    <!-- Photo -->
    <clipPath id="photoClip">
      <rect x="62"
            y="132"
            width="480"
            height="382"
            rx="12"/>
    </clipPath>

    <!-- Text -->
