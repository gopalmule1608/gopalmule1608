<svg xmlns="http://www.w3.org/2000/svg"
     width="1180" height="610" viewBox="0 0 1180 610"
     role="img"
     aria-label="Gopal Mule — Frontend Developer GitHub profile banner">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#061326"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>

    <!-- Cyan line -->
    <linearGradient id="cyanLine" x1="0" x2="1">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>

    <!-- Photo glow -->
    <radialGradient id="photoGlow">
      <stop offset="0" stop-color="#008cff" stop-opacity=".55"/>
      <stop offset=".65" stop-color="#0066ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">

      <path d="M28 0H0V28"
            fill="none"
            stroke="#22D3EE"
            stroke-opacity=".045"/>
    </pattern>

    <!-- Shadow -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">

      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity=".45"/>
    </filter>

    <!-- Photo glow -->
    <filter id="photoGlowFilter"
            x="-40%"
            y="-40%"
            width="180%"
            height="180%">

      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- Photo clipping -->
    <clipPath id="photoClip">
      <rect
        x="62"
        y="132"
        width="480"
        height="382"
        rx="12"/>
    </clipPath>

    <!-- Fonts -->
    <style>

      .mono {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          monospace;
      }

      .label {
        font:
          600 12px
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        letter-spacing: 2px;
        fill: #94A3B8;
      }

      .small {
        font:
          500 13px
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        fill: #94A3B8;
      }

      .value {
        font:
          600 16px
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        fill: #F8FAFC;
      }

      .title {
        font:
          800 42px
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        fill: #F8FAFC;
      }

      .role {
        font:
          700 25px
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        fill: #22D3EE;
      }

      .pill {
        font:
          600 12px
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        fill: #E2E8F0;
      }

    </style>

  </defs>


  <!-- ===================================================== -->
