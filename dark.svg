<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
     role="img" aria-label="Gopal Mule — Frontend Developer. Modern, responsive &amp; interactive web experiences.">
  <title>Gopal Mule — Frontend Developer</title>
  <desc>Premium terminal-inspired professional profile banner with visual identity on the left and system information on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".58" stop-color="#07111F"/>
      <stop offset="1" stop-color="#172033"/>
      <animate attributeName="x1" values="0;0.15;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".15"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22D3EE" stop-opacity=".9"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".30"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22D3EE" stroke-opacity=".035"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 2px; fill: #94A3B8; }
      .value { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #F8FAFC; }
      .small { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #94A3B8; }
      .pill { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #F8FAFC; }
    </style>
  </defs>

  <rect x="4" y="4" width="1172" height="602" rx="24" fill="url(#bg)" stroke="#243247" filter="url(#shadow)"/>
  <rect x="4" y="4" width="1172" height="602" rx="24" fill="url(#grid)"/>
  <circle cx="80" cy="80" r="260" fill="url(#glowA)"/>
  <circle cx="1110" cy="520" r="300" fill="url(#glowB)"/>

  <!-- terminal/editor chrome -->
  <rect x="28" y="28" width="1124" height="42" rx="13" fill="#0F172A" fill-opacity=".72" stroke="#243247"/>
  <circle cx="51" cy="49" r="5" fill="#FF5F57"/>
  <circle cx="69" cy="49" r="5" fill="#FEBC2E"/>
  <circle cx="87" cy="49" r="5" fill="#28C840"/>
  <text x="110" y="54" class="small">gopalmule1608@profile</text>
  <text x="1040" y="54" class="label" fill="#10B981">● ONLINE</text>

  <!-- left identity -->
  <rect x="28" y="88" width="510" height="494" rx="20" fill="#0F172A" fill-opacity=".42" stroke="#243247"/>
  <text x="283" y="124" text-anchor="middle" class="label">VISUAL.IDENTITY</text>

  <!-- abstract ASCII / dot-matrix portrait substitute because no personal photo was supplied -->
  <g transform="translate(112 148)" class="mono" fill="#22D3EE" opacity=".9">
    <text x="0" y="0" font-size="10">       .·:+*#%%#*+:.       </text>
    <text x="0" y="12" font-size="10">     .·+*#%%%%%%#*+·.     </text>
    <text x="0" y="24" font-size="10">    :+*#%%@%%%%%%#*+:    </text>
    <text x="0" y="36" font-size="10">   :*#%%@%%%%%%@%%#*:   </text>
    <text x="0" y="48" font-size="10">  .+#%%@%%#**#%%@%%#+.  </text>
    <text x="0" y="60" font-size="10">  *#%%@%%*·  ·*%%@%%#*  </text>
    <text x="0" y="72" font-size="10"> :#%%@%%#·    ·#%%@%%#: </text>
    <text x="0" y="84" font-size="10"> *#%%%%%#·    ·#%%%%%#* </text>
    <text x="0" y="96" font-size="10"> #%%%%%%#·    ·#%%%%%%# </text>
    <text x="0" y="108" font-size="10"> #%%%%%%#· ·· ·#%%%%%%# </text>
    <text x="0" y="120" font-size="10"> *#%%%%%%#****#%%%%%%#* </text>
    <text x="0" y="132" font-size="10"> :#%%%%%%%%%%%%%%%%%%#: </text>
    <text x="0" y="144" font-size="10">  *#%%%%%%%%%%%%%%%%#*  </text>
    <text x="0" y="156" font-size="10">  :#%%%%%%%%%%%%%%%%#:  </text>
    <text x="0" y="168" font-size="10">   *#%%%%%%%%%%%%%%#*   </text>
    <text x="0" y="180" font-size="10">    :+#%%%%%%%%%%#+:    </text>
    <text x="0" y="192" font-size="10">      ·*#%%%%%%#*·      </text>
    <text x="0" y="204" font-size="10">       :+*####*+:       </text>
    <animateTransform attributeName="transform" type="translate" values="112 148;112 151;112 148" dur="7s" repeatCount="indefinite"/>
  </g>
  <text x="283" y="386" text-anchor="middle" class="label">ENGINEERING / WEB</text>
  <text x="283" y="420" text-anchor="middle" style="font:700 27px ui-monospace,monospace;fill:#F8FAFC">Frontend Developer</text>
  <text x="283" y="449" text-anchor="middle" class="small">Modern, responsive &amp; interactive web experiences</text>
  <line x1="125" y1="478" x2="441" y2="478" stroke="url(#line)" stroke-width="1"/>
  <text x="145" y="515" class="small">~/profile $</text>
  <text x="246" y="515" class="value">build --ship</text>
  <rect x="384" y="503" width="7" height="17" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- right system info -->
  <rect x="558" y="88" width="594" height="494" rx="20" fill="#0F172A" fill-opacity=".72" stroke="#243247"/>
  <text x="594" y="125" class="label">SYSTEM.INFO</text>
  <text x="594" y="153" class="small">gopal@profile:~$ ./profile.sh</text>
  <line x1="594" y1="171" x2="1116" y2="171" stroke="#243247"/>

  <g>
    <text x="650" y="205" text-anchor="end" class="label">NAME</text>
    <text x="674" y="205" class="value">Gopal Mule</text>
    <text x="650" y="241" text-anchor="end" class="label">ROLE</text>
    <text x="674" y="241" class="value">Frontend Developer</text>
    <text x="650" y="277" text-anchor="end" class="label">EDU</text>
    <text x="674" y="277" class="value">BCA Science · BAMU University</text>
    <text x="650" y="313" text-anchor="end" class="label">COLLEGE</text>
    <text x="674" y="313" class="small">Shivchhatrapati College, Chhatrapati Sambhajinagar</text>
    <text x="650" y="349" text-anchor="end" class="label">FOCUS</text>
    <text x="674" y="349" class="small">Modern, responsive &amp; interactive web experiences</text>
  </g>

  <text x="594" y="390" class="label">CORE.STACK</text>
  <g>
    
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" begin="1.8s" dur=".45s" fill="freeze"/>
          <rect x="635" y="470" width="60" height="28" rx="14" fill="#172033" stroke="#243247"/>
          <circle cx="648" cy="484" r="3" fill="#22D3EE"/>
          <text x="658" y="489" class="pill">HTML</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" begin="1.92s" dur=".45s" fill="freeze"/>
          <rect x="704" y="470" width="52" height="28" rx="14" fill="#172033" stroke="#243247"/>
          <circle cx="717" cy="484" r="3" fill="#22D3EE"/>
          <text x="727" y="489" class="pill">CSS</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" begin="2.04s" dur=".45s" fill="freeze"/>
          <rect x="765" y="470" width="108" height="28" rx="14" fill="#172033" stroke="#243247"/>
          <circle cx="778" cy="484" r="3" fill="#22D3EE"/>
          <text x="788" y="489" class="pill">JavaScript</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" begin="2.16s" dur=".45s" fill="freeze"/>
          <rect x="882" y="470" width="92" height="28" rx="14" fill="#172033" stroke="#243247"/>
          <circle cx="895" cy="484" r="3" fill="#22D3EE"/>
          <text x="905" y="489" class="pill">React.js</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" begin="2.2800000000000002s" dur=".45s" fill="freeze"/>
          <rect x="983" y="470" width="124" height="28" rx="14" fill="#172033" stroke="#243247"/>
          <circle cx="996" cy="484" r="3" fill="#22D3EE"/>
          <text x="1006" y="489" class="pill">Tailwind CSS</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" begin="2.4s" dur=".45s" fill="freeze"/>
          <rect x="635" y="512" width="60" height="28" rx="14" fill="#172033" stroke="#243247"/>
          <circle cx="648" cy="526" r="3" fill="#22D3EE"/>
          <text x="658" y="531" class="pill">GSAP</text>
        </g>
  </g>

  <g opacity=".9">
    <text x="594" y="548" class="small">CONTACT</text>
    <text x="664" y="548" class="small">github.com/gopalmule1608</text>
    <text x="938" y="548" class="small">linkedin.com/in/gopal-mule-ba89233b1</text>
  </g>

  <!-- restrained scanline -->
  <rect x="29" y="90" width="1122" height="2" fill="url(#line)" opacity=".35">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 485;0 0" dur="11s" repeatCount="indefinite"/>
  </rect>
</svg>